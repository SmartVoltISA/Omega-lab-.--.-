name: Space prototype tests

on:
  push:
    paths:
      - 'space/prototype/**'
      - '.github/workflows/space-prototype.yml'
  pull_request:
    paths:
      - 'space/prototype/**'
      - '.github/workflows/space-prototype.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run registry tests
        working-directory: space/prototype
        run: python -m unittest -v test_capability_registry.py
