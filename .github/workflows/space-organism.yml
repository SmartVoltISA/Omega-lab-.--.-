name: space-organism

# CI acceptance gate for the autonomous-organ/closed-loop space organism.

on:
  push:
    paths:
      - 'space/**'
      - '.github/workflows/space-organism.yml'
  pull_request:
    paths:
      - 'space/**'
      - '.github/workflows/space-organism.yml'

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Space tests
        run: python -m unittest discover -s space -p 'test_*.py'
      - name: Collect test report
        if: always()
        run: |
          mkdir -p ci-results
          python -m unittest discover -s space -p 'test_*.py' > ci-results/space-test-report.txt 2>&1 || true
          printf 'commit=%s\nworkflow=%s\nrun=%s\n' "$GITHUB_SHA" "$GITHUB_WORKFLOW" "$GITHUB_RUN_ID" > ci-results/run-metadata.txt
      - name: Upload Space test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: space-test-results-${{ github.run_id }}
          path: ci-results/
          if-no-files-found: error
          retention-days: 30
