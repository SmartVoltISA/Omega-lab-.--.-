name: space-organism

on:
  push:
    paths:
      - 'space/**'
      - '.github/workflows/space-organism.yml'
  pull_request:
    paths:
      - 'space/**'
      - '.github/workflows/space-organism.yml'

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Space tests
        run: python -m unittest discover -s space -p 'test_*.py'
