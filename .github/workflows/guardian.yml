name: Guardian Core CI

on:
  push:
    paths:
      - 'space/security/**'
      - '.github/workflows/guardian.yml'
  pull_request:
    paths:
      - 'space/security/**'
      - '.github/workflows/guardian.yml'

jobs:
  guardian-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Guardian tests
        working-directory: space/security
        run: python -m unittest -v test_guardian_core.py
