name: omega-execution-1

on:
  push:
    paths:
      - 'experiments/Omega-EXECUTION-1/**'
      - '.github/workflows/omega-execution-1.yml'
  pull_request:
    paths:
      - 'experiments/Omega-EXECUTION-1/**'
      - '.github/workflows/omega-execution-1.yml'
  workflow_dispatch:

jobs:
  verify-execution-boundary:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/Omega-EXECUTION-1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run execution boundary tests
        run: python -m unittest -v test_execution.py
