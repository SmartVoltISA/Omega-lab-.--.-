name: Ω-LINK-1

on:
  push:
    paths:
      - 'experiments/Omega-LINK-1/**'
      - '.github/workflows/omega-link-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Ω-LINK-1 reachability
        run: python experiments/Omega-LINK-1/run_link1.py > link1_results.txt
      - name: Run Ω-LINK-1 edge influence
        run: python experiments/Omega-LINK-1/influence_link1.py > influence_results.txt
      - name: Run Ω-LINK-1 local-global control
        run: python experiments/Omega-LINK-1/local_global_link1.py > local_global_results.txt
      - name: Run Ω-LINK-1 edge addition
        run: python experiments/Omega-LINK-1/addition_link1.py > addition_results.txt
      - name: Run Ω-LINK-1 directionality control
        run: python experiments/Omega-LINK-1/direction_link1.py > direction_results.txt
      - name: Run Ω-LINK-1 memory-state experiment
        run: python experiments/Omega-LINK-1/memory_state_link1.py > memory_state_results.txt
      - name: Run Ω-LINK-1 hidden-history inference
        run: python experiments/Omega-LINK-1/hidden_history_link1.py > hidden_history_results.txt
      - name: Run Ω-LINK-1 state augmentation
        run: python experiments/Omega-LINK-1/state_augmentation_link1.py > state_augmentation_results.txt
      - name: Run Ω-LINK-1 minimal sufficient state
        run: python experiments/Omega-LINK-1/minimal_state_link1.py > minimal_state_results.txt
      - name: Run Ω-LINK-1 deep memory
        run: python experiments/Omega-LINK-1/deep_memory_link1.py > deep_memory_results.txt
      - name: Run Ω-LINK-1 depth sweep
        run: python experiments/Omega-LINK-1/depth_sweep_link1.py > depth_sweep_results.txt
      - name: Run Ω-LINK-1 state distinguishability
        run: python experiments/Omega-LINK-1/state_distinguishability_link1.py > state_distinguishability_results.txt
      - name: Run Ω-LINK-1 state distinguishability rule cross-check
        run: python experiments/Omega-LINK-1/state_distinguishability_v2_link1.py > state_distinguishability_v2_results.txt
      - name: Run Ω-LINK-1 predictive state horizon
        run: python experiments/Omega-LINK-1/predictive_state_horizon_link1.py > predictive_state_horizon_results.txt
      - name: Run Ω-LINK-1 future divergence
        run: python experiments/Omega-LINK-1/future_divergence_link1.py > future_divergence_results.txt
      - name: Run Ω-LINK-1 minimal horizon validation
        run: python experiments/Omega-LINK-1/minimal_horizon_link1.py > minimal_horizon_results.txt
      - name: Run Ω-LINK-1 exhaustive minimal horizon control
        run: python experiments/Omega-LINK-1/exhaustive_horizon_link1.py > exhaustive_horizon_results.txt
      - name: Run Ω-LINK-1 exhaustive 3-state horizon control
        run: python experiments/Omega-LINK-1/exhaustive_horizon_3state_link1.py > exhaustive_horizon_3state_results.txt
      - name: Run Ω-LINK-1 exhaustive 2-memory binary horizon control
        run: python experiments/Omega-LINK-1/exhaustive_horizon_2memory_binary_link1.py > exhaustive_horizon_2memory_binary_results.txt
      - name: Run Ω-LINK-1 exhaustive 3-memory binary horizon control
        run: python experiments/Omega-LINK-1/exhaustive_horizon_3memory_binary_link1.py > exhaustive_horizon_3memory_binary_results.txt
      - name: Run Ω-LINK-1 horizon mechanism witness
        run: python experiments/Omega-LINK-1/horizon_mechanism_link1.py > horizon_mechanism_results.txt
      - name: Run Ω-LINK-1 hidden vs explicit state equivalence
        run: python experiments/Omega-LINK-1/explicit_state_equivalence_link1.py > explicit_state_equivalence_results.txt
      - name: Run Ω-LINK-1 corrected hidden vs explicit delayed control
        run: python experiments/Omega-LINK-1/corrected_hidden_explicit_control_link1.py > corrected_hidden_explicit_results.txt
      - name: Combine results
        run: cat link1_results.txt influence_results.txt local_global_results.txt addition_results.txt direction_results.txt memory_state_results.txt hidden_history_results.txt state_augmentation_results.txt minimal_state_results.txt deep_memory_results.txt depth_sweep_results.txt state_distinguishability_results.txt state_distinguishability_v2_results.txt predictive_state_horizon_results.txt future_divergence_results.txt minimal_horizon_results.txt exhaustive_horizon_results.txt exhaustive_horizon_3state_results.txt exhaustive_horizon_2memory_binary_results.txt exhaustive_horizon_3memory_binary_results.txt horizon_mechanism_results.txt explicit_state_equivalence_results.txt corrected_hidden_explicit_results.txt > omega_link1_results.txt
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: omega-link-1-results
          path: omega_link1_results.txt
