name: SPACE Compression Clone Experiment

on:
  push:
    branches:
      - 'experiment/compression'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_EXCLUDES: "./.git/*|./evidence/*|*/__pycache__/*|*.pyc"

# Canonical lossless path: TAR.GZ. ZIP remains diagnostic because this repository
# contains legacy filenames with embedded newline characters that the runner's
# zip implementation normalizes on restore.

jobs:
  compression-clone:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout experiment clone only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/original_commit.txt
          python -m unittest discover -s space -p 'test_*.py' | tee evidence/baseline_tests.txt
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib
          root = Path('.')
          excluded = {'.git', 'evidence', '__pycache__'}
          rows = []
          for p in sorted(root.rglob('*')):
              if not p.is_file() or p.suffix == '.pyc' or any(part in excluded for part in p.parts):
                  continue
              encoded_path = base64.urlsafe_b64encode(p.as_posix().encode('utf-8')).decode('ascii')
              rows.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {encoded_path}\n")
          Path('/tmp/original_manifest.sha256').write_text(''.join(rows), encoding='utf-8')
          Path('evidence/original_manifest.sha256').write_text(''.join(rows), encoding='utf-8')
          PY
          du -sk --exclude=.git --exclude=evidence . | tee evidence/original_size_kb.txt

      - name: Make isolated clone
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/space-clone
          mkdir -p /tmp/space-clone
          tar --exclude=.git --exclude=evidence --exclude='*/__pycache__/*' --exclude='*.pyc' -cf /tmp/space-clone/source.tar .
          mkdir /tmp/space-clone/source
          tar -xf /tmp/space-clone/source.tar -C /tmp/space-clone/source

      - name: Compress clone
        shell: bash
        run: |
          set -euo pipefail
          gzip -9 -c /tmp/space-clone/source.tar > /tmp/space-clone/source.tar.gz
          (cd /tmp/space-clone/source && zip -9 -qr /tmp/space-clone/source.zip .)
          stat -c '%n %s bytes' /tmp/space-clone/source.tar /tmp/space-clone/source.tar.gz /tmp/space-clone/source.zip | tee evidence/compression_sizes.txt

      - name: Restore clone
        shell: bash
        run: |
          set -euo pipefail
          mkdir /tmp/space-clone/restored-tar /tmp/space-clone/restored-zip
          gzip -dc /tmp/space-clone/source.tar.gz > /tmp/space-clone/restored.tar
          tar -xf /tmp/space-clone/restored.tar -C /tmp/space-clone/restored-tar
          unzip -q /tmp/space-clone/source.zip -d /tmp/space-clone/restored-zip

      - name: Verify canonical TAR.GZ restore and run tests
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/space-clone/restored-tar
          python - "$root" evidence/restored_tar_manifest.sha256 <<'PY'
          from pathlib import Path
          import base64, hashlib, sys
          root = Path(sys.argv[1])
          out = Path(sys.argv[2])
          rows = []
          for p in sorted(root.rglob('*')):
              if not p.is_file() or p.suffix == '.pyc' or '__pycache__' in p.parts:
                  continue
              encoded_path = base64.urlsafe_b64encode(p.relative_to(root).as_posix().encode('utf-8')).decode('ascii')
              rows.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {encoded_path}\n")
          out.write_text(''.join(rows), encoding='utf-8')
          PY
          diff -u /tmp/original_manifest.sha256 evidence/restored_tar_manifest.sha256
          (cd "$root" && python -m unittest discover -s space -p 'test_*.py') | tee evidence/restored_tar_tests.txt

      - name: Diagnose ZIP compatibility
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/space-clone/restored-zip
          python - "$root" evidence/restored_zip_manifest.sha256 <<'PY'
          from pathlib import Path
          import base64, hashlib, sys
          root = Path(sys.argv[1])
          out = Path(sys.argv[2])
          rows = []
          for p in sorted(root.rglob('*')):
              if not p.is_file() or p.suffix == '.pyc' or '__pycache__' in p.parts:
                  continue
              encoded_path = base64.urlsafe_b64encode(p.relative_to(root).as_posix().encode('utf-8')).decode('ascii')
              rows.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {encoded_path}\n")
          out.write_text(''.join(rows), encoding='utf-8')
          PY
          if diff -u /tmp/original_manifest.sha256 evidence/restored_zip_manifest.sha256 > evidence/zip_manifest_diff.txt; then
            echo 'ZIP_RESTORE=LOSSLESS' | tee evidence/zip_compatibility.txt
          else
            echo 'ZIP_RESTORE=NONLOSSLESS_LEGACY_FILENAME_NORMALIZATION' | tee evidence/zip_compatibility.txt
          fi
          (cd "$root" && python -m unittest discover -s space -p 'test_*.py') | tee evidence/restored_zip_tests.txt

      - name: Preserve evidence
        if: always()
        run: |
          printf 'source_commit=%s\nrun=%s\nworkflow=%s\nmain_touched=false\nexperiment=clone-only\ncanonical=tar.gz\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_WORKFLOW" > evidence/metadata.txt

      - name: Upload experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: space-compression-clone-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
