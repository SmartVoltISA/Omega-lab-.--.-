name: SPACE Compression Clone Experiment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compression-clone:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout original read-only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Baseline manifest and tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p experiment-results clone-work
          git rev-parse HEAD | tee experiment-results/original-commit.txt
          find . -type f -not -path './.git/*' -print0 | sort -z | xargs -0 sha256sum > experiment-results/original-manifest.sha256
          du -sh . | tee experiment-results/original-working-tree-size.txt
          python -m unittest discover -s space -p 'test_*.py' | tee experiment-results/baseline-tests.txt

      - name: Create isolated experiment clone
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude='./.git' -cf clone-work/space-source.tar .
          mkdir clone-work/restored
          tar -xf clone-work/space-source.tar -C clone-work/restored

      - name: Compress clone
        shell: bash
        run: |
          set -euo pipefail
          gzip -9 -c clone-work/space-source.tar > clone-work/space-source.tar.gz
          zip -9 -qr clone-work/space-source.zip . -x '.git/*' 'clone-work/*' 'experiment-results/*'
          ls -lh clone-work/space-source.* | tee experiment-results/compression-sizes.txt

      - name: Restore compressed clone
        shell: bash
        run: |
          set -euo pipefail
          rm -rf clone-work/restored-tar clone-work/restored-zip
          mkdir clone-work/restored-tar clone-work/restored-zip
          gzip -dc clone-work/space-source.tar.gz > clone-work/restored-source.tar
          tar -xf clone-work/restored-source.tar -C clone-work/restored-tar
          unzip -q clone-work/space-source.zip -d clone-work/restored-zip

      - name: Verify manifests after restore
        shell: bash
        run: |
          set -euo pipefail
          (cd clone-work/restored-tar && find . -type f -print0 | sort -z | xargs -0 sha256sum | sed 's#^#TAR:#') > experiment-results/restored-tar-manifest.sha256
          (cd clone-work/restored-zip && find . -type f -print0 | sort -z | xargs -0 sha256sum | sed 's#^#ZIP:#') > experiment-results/restored-zip-manifest.sha256
          diff -u experiment-results/original-manifest.sha256 <(sed 's#^#ORIG:#' experiment-results/original-manifest.sha256 | sed 's#^ORIG:##')

      - name: Run restored clone tests
        shell: bash
        run: |
          set -euo pipefail
          (cd clone-work/restored-tar && python -m unittest discover -s space -p 'test_*.py') | tee experiment-results/restored-tar-tests.txt
          (cd clone-work/restored-zip && python -m unittest discover -s space -p 'test_*.py') | tee experiment-results/restored-zip-tests.txt

      - name: Record experiment evidence
        if: always()
        shell: bash
        run: |
          printf 'original_commit=%s\nrun=%s\nworkflow=%s\noriginal_preserved=true\nexperiment=clone-only\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_WORKFLOW" > experiment-results/experiment-metadata.txt

      - name: Upload compression experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: space-compression-clone-${{ github.run_id }}
          path: experiment-results/
          if-no-files-found: error
          retention-days: 30
