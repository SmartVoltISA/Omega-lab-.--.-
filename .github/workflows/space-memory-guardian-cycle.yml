name: Space Memory Guardian Cycle

on:
  push:
    paths:
      - 'space/integration/**'
      - 'space/prototype/**'
      - 'space/security/**'
      - 'tools/graph_memory_inspector/**'
      - '.github/workflows/space-memory-guardian-cycle.yml'
  pull_request:
    paths:
      - 'space/integration/**'
      - 'space/prototype/**'
      - 'space/security/**'
      - 'tools/graph_memory_inspector/**'
      - '.github/workflows/space-memory-guardian-cycle.yml'

jobs:
  closed-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run closed-loop tests
        run: python -m unittest -v space/integration/test_space_memory_guardian_cycle.py 2>&1 | tee space-memory-guardian-cycle-report.txt
      - name: Save cycle evidence
        if: always()
        run: printf 'commit=%s\nrun=%s\nworkflow=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_WORKFLOW" > cycle-run-metadata.txt
      - name: Upload cycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: space-memory-guardian-cycle-${{ github.run_id }}
          path: |
            space-memory-guardian-cycle-report.txt
            cycle-run-metadata.txt
          if-no-files-found: error
          retention-days: 30
