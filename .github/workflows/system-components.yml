name: Ω-Lab Local Components CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  omega-loop-guard:
    name: Ω Loop Guard Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run local Ω loop-guard tests
        run: python -m pytest -q 00_CORE/test_omega_loop_guard.py

  graph-memory:
    name: Graph Memory Inspector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run graph inspector tests
        working-directory: tools/graph_memory_inspector
        run: python -m unittest test_inspector.py -v

  local-components-gate:
    name: Local Research Tools Gate
    needs: [omega-loop-guard, graph-memory]
    runs-on: ubuntu-latest
    steps:
      - name: Record scope
        run: |
          echo "PASS: Ω-Lab-local loop guard and graph-memory inspector tests passed."
          echo "SCOPE: this gate covers executable components present in Ω-Lab."
          echo "SPACE / Guardian tests belong to their canonical repositories."
          echo "Removed duplicate SPACE implementations are not restored or represented as passing here."
